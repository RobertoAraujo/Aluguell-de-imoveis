spring.application.name=Api-Alugel-Imoveis
server.port=8080
# Configurações do servidor
server.servlet.context-path=/ApiAlugelImoveis
spring.config.import=optional:classpath:.env[.properties]]

# Configurações do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_alugel
spring.datasource.username=${ENV_ROOT_USER:postgres}
spring.datasource.password=${ENV_ROOT_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configuração opcional do HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariPool-1
